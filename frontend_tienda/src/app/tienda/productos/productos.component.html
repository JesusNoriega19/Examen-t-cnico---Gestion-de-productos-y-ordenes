<h2>Gestión de Productos</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-form-field appearance="outline">
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="nombre">
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Precio</mat-label>
    <input matInput type="number" formControlName="precio">
  </mat-form-field>

  <button mat-raised-button color="primary">
    {{ modoEdicion ? 'Actualizar' : 'Crear' }}
  </button>

  <button mat-button color="warn" *ngIf="modoEdicion" (click)="cancelar()">
    Cancelar
  </button>
</form>

<table mat-table [dataSource]="productos" class="mat-elevation-z8">
  <ng-container matColumnDef="idProducto">
    <th mat-header-cell *matHeaderCellDef>ID producto</th>
    <td mat-cell *matCellDef="let p">{{ p.idProducto }}</td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="precio">
    <th mat-header-cell *matHeaderCellDef>Precio</th>
    <td mat-cell *matCellDef="let p">{{ p.precio | currency }}</td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let p">
      <button mat-button color="accent" (click)="editar(p)">Editar</button>
      <button mat-button color="warn" (click)="eliminar(p.idProducto)">Eliminar</button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="['idProducto','nombre','precio','acciones']"></tr>
  <tr mat-row *matRowDef="let row; columns: ['idProducto','nombre','precio','acciones']"></tr>
</table>
